name: Release Dev Container Features

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to publish stale generated features
        run: |
          ./devcontainer/generate.sh
          if ! git diff --exit-code devcontainer/; then
            echo "::error::Generated features are stale. Run ./devcontainer/generate.sh and commit the result."
            exit 1
          fi

      - name: Publish Features
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./devcontainer"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
